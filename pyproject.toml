[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-xai"
version = "0.1.0"
description = "Bird XAI v1 contract-first migration pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "jsonschema>=4.22,<5",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "xarray>=2024.6.0",
  "netCDF4>=1.7,<2",
  "torch>=2.3,<3",
  "shap>=0.46,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "websockets>=12,<16",
]

[project.scripts]
bird-xai-preprocess = "ai.training.preprocessing.pipeline:main"
bird-xai-train = "ai.training.model.train:main"
bird-xai-server = "ai.server.app:run"
bird-xai-ws-smoke = "ai.server.smoke_client:main"

[tool.setuptools.packages.find]
include = ["ai*"]

[tool.setuptools.package-data]
"ai.server" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
