[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-xai"
version = "0.1.0"
description = "철새 GPS·기후 데이터로 이동 경로를 예측하고, 순풍·역풍·날씨(XAI)를 색으로 보여 주며, 관람객 바람으로 전시가 바뀌는 인터랙티브 미디어아트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "jsonschema>=4.22,<5",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "xarray>=2024.6.0",
  "netCDF4>=1.7,<2",
  "torch>=2.3,<3",
  "attrs>25.1.0,<27",
  "httpx>=0.27,<1",
  "websockets>=12,<16",
  "captum>=0.9.0,<1.0.0",
  "joblib>=1.5.3,<1.6.0",
  "optuna>=4.8.0,<4.9.0",
  "scikit-learn>=1.7.0,<1.9.0",
  "limits>=3.13,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
bird-xai-preprocess = "data.preprocess:main"
bird-xai-train = "ai.training.train:main"
bird-xai-server = "ai.server.app:main"
bird-xai-ws-smoke = "tests.smoke_client:main"

[tool.setuptools.packages.find]
include = ["ai*", "tests*"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
